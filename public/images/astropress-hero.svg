        <tspan fill="#f8fafc"> posts </tspan>
        <tspan fill="#94a3b8">= </tspan>
        <tspan fill="#ec4899">await</tspan>
        <tspan fill="#38bdf8"> getCollection</tspan>
        <tspan fill="#f8fafc">('posts');</tspan>
      </text>
      <!-- Line 6: Frontmatter end -->
      <text x="0" y="118" fill="#ec4899">---</text>

      <!-- Line 7-11: Astro Template with Island -->
      <text x="0" y="148" fill="#38bdf8">&lt;<tspan fill="#f43f5e">Layout</tspan> <tspan fill="#a7f3d0">title</tspan>=<tspan fill="#fcd34d">"AstroPress"</tspan>&gt;</text>
      <text x="16" y="172" fill="#38bdf8">&lt;<tspan fill="#60a5fa">HeroSection</tspan> <tspan fill="#a7f3d0">client:load</tspan>&gt;</text>
      <text x="32" y="196">
        <tspan fill="#38bdf8">&lt;<tspan fill="#f43f5e">h1</tspan>&gt;</tspan>
        <tspan fill="#f8fafc">Next-Gen Publishing</tspan>
        <tspan fill="#38bdf8">&lt;/<tspan fill="#f43f5e">h1</tspan>&gt;</tspan>
      </text>
      <text x="32" y="220">
        <tspan fill="#38bdf8">&lt;<tspan fill="#f43f5e">p</tspan>&gt;</tspan>
        <tspan fill="#94a3b8">Automated WebP + Sveltia CMS</tspan>
        <tspan fill="#38bdf8">&lt;/<tspan fill="#f43f5e">p</tspan>&gt;</tspan>
      </text>
      <text x="16" y="244" fill="#38bdf8">&lt;/<tspan fill="#60a5fa">HeroSection</tspan>&gt;</text>
      <text x="0" y="268" fill="#38bdf8">&lt;/<tspan fill="#f43f5e">Layout</tspan>&gt;</text>
