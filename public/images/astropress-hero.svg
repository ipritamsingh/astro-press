        <tspan fill="#ec4899">import</tspan>
        <tspan fill="#f8fafc"> { HeroSection } </tspan>
        <tspan fill="#ec4899">from</tspan>
        <tspan fill="#38bdf8"> './components/Hero'</tspan>
        <tspan fill="#94a3b8">;</tspan>
      </text>
