        <tspan fill="#818cf8"> prerender</tspan>
        <tspan fill="#94a3b8"> = </tspan>
        <tspan fill="#f59e0b">true</tspan>
        <tspan fill="#94a3b8">; </tspan>
        <tspan fill="#64748b">// ⚡ Cloudflare Edge Static</tspan>
      </text>
